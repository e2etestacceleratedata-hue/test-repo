version: 2

models:
  - name: stg_customers
    description: "Staging model for customer data. One row per customer."
    columns:
      - name: customer_id
        description: "Unique customer identifier"
        data_tests:
          - not_null
          - unique

      - name: customer_name
        description: "Customer company name"
        data_tests:
          - not_null

      - name: customer_email
        description: "Customer contact email"
        data_tests:
          - not_null

      - name: signup_date
        description: "Date the customer signed up"
