version: 2

models:
  - name: stg_customers
    description: >
      Staging model for customer data. Provides a cleaned, standardized view
      of customer data for downstream analytics. 1:1 mapping from raw.customers
      with trimmed string values.
    columns:
      - name: customer_id
        description: Unique customer identifier
        data_type: int
        tests:
          - unique
          - not_null

      - name: name
        description: Customer company name (trimmed)
        data_type: string
        tests:
          - not_null

      - name: email
        description: Customer contact email (trimmed)
        data_type: string
        tests:
          - not_null

      - name: signup_date
        description: Date the customer signed up
        data_type: date
