version: 2

models:
  - name: stg_customers
    description: |
      Staging layer for customer master data. Provides a clean, standardized
      view of customer information sourced from the raw.customers seed table.
      One row per customer with no transformations applied.
    columns:
      - name: customer_id
        description: Unique identifier for each customer (primary key)
        data_tests:
          - unique
          - not_null

      - name: name
        description: Customer company name
        data_tests:
          - not_null

      - name: email
        description: Customer contact email address
        data_tests:
          - not_null

      - name: signup_date
        description: Date when the customer signed up for the service
        data_tests:
          - not_null

unit_tests:
  - name: test_stg_customers_preserves_input
    description: |
      Verify that stg_customers correctly passes through customer data
      with trimmed string values
    model: stg_customers
    given:
      - input: source('raw', 'customers')
        rows:
          - customer_id: 1
            name: 'Acme'
            email: 'ops@acme.com'
            signup_date: '2024-01-15'
    expect:
      rows:
        - customer_id: 1
          name: 'Acme'
          email: 'ops@acme.com'
          signup_date: '2024-01-15'
